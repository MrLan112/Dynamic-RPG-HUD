name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: mc
    attributes:
      label: Minecraft and mod version
      placeholder: "1.21.1, Dynamic RPG HUD 2.2.0"
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Other installed mods
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: latest.log or crash report (link or paste)
